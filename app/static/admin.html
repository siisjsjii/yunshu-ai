<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库管理 · 小喵</title>
<style>
  :root {
    --bg:        #e8f2fb;
    --bg-line:   #d3e6f7;
    --brand:     #2f6fb0;
    --brand-dim: #245a90;
    --ink:       #1c2b39;
    --bubble:    #ffffff;
    --badge:     #4a7fb5;
    --warn:      #c2570f;
    --ok:        #2e7d32;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 16px 40px;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--bg-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-line) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; background: var(--brand); color: #fff;
    border: 3px solid var(--brand-dim); border-radius: 4px;
    box-shadow: 6px 6px 0 rgba(47,111,176,.18);
  }
  header .avatar { width: 40px; height: 40px; display: grid; place-items: center;
    font-size: 22px; background: #fff; border-radius: 4px; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .5px; }
  header .spacer { flex: 1; }
  header a { font-size: 13px; color: #fff; text-decoration: none;
    border: 2px solid #fff; border-radius: 3px; padding: 7px 14px; }
  header a:hover { background: #dcebf9; color: var(--brand); }

  .stats { display: flex; gap: 10px; margin: 16px 0; }
  .stat { flex: 1; background: var(--bubble); border: 2px solid var(--ink);
    border-radius: 4px; padding: 10px 12px; }
  .stat .n { font-size: 22px; font-weight: 700; }
  .stat .l { font-size: 12px; color: #5b7186; }

  .card { background: var(--bubble); border: 2px solid var(--ink); border-radius: 4px;
    padding: 14px 16px; margin: 16px 0; box-shadow: 4px 4px 0 rgba(28,43,57,.10); }
  .card h2 { margin: 0 0 10px; font-size: 15px; }

  .doc-list { list-style: none; margin: 0; padding: 0; }
  .doc-list li { display: flex; align-items: center; gap: 10px;
    padding: 8px 6px; border-bottom: 1px dashed #cdd9e4; cursor: pointer; }
  .doc-list li:hover { background: #f0f7fd; }
  .doc-list li .name { font-weight: 600; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px;
    color: var(--badge); border: 1.5px dashed var(--badge); }
  .muted { color: #5b7186; font-size: 12px; }

  .pre { white-space: pre-wrap; word-break: break-word; background: #f5f9fd;
    border: 1px solid #d3e6f7; border-radius: 3px; padding: 12px; max-height: 420px;
    overflow: auto; font-size: 13.5px; line-height: 1.65; }

  .form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .form-row label { font-size: 13px; color: #5b7186; display: flex; align-items: center; gap: 6px; }
  input[type=text], select, textarea {
    font: inherit; font-size: 14px; padding: 8px 10px; color: var(--ink);
    background: #fff; border: 2px solid var(--ink); border-radius: 3px; }
  input[type=text] { flex: 1; min-width: 160px; }
  textarea { width: 100%; min-height: 120px; resize: vertical; }
  button { font: inherit; font-size: 14px; padding: 9px 16px; color: #fff;
    background: var(--brand); border: 2px solid var(--brand-dim); border-radius: 3px;
    cursor: pointer; }
  button:hover:not(:disabled) { background: var(--brand-dim); }
  button:disabled { opacity: .45; cursor: default; }
  button.secondary { background: #fff; color: var(--brand); }

  .job-status { margin-top: 10px; padding: 10px 12px; border: 1.5px dashed var(--badge);
    border-radius: 3px; font-size: 13.5px; }
  .job-status.done { border-color: var(--ok); color: var(--ok); }
  .job-status.failed { border-color: var(--warn); color: var(--warn); }
  .qa-item { padding: 8px 0; border-bottom: 1px dashed #cdd9e4; }
  .qa-item .q { font-weight: 600; }
  .qa-item .a { color: #40586e; font-size: 13px; margin-top: 2px; }
  .qa-item .c { color: var(--badge); font-size: 11.5px; }
  .qa-item .meta { display: flex; gap: 10px; align-items: center; margin-top: 2px; }
  .src-link { font-size: 12.5px; color: var(--brand); text-decoration: none;
    border-bottom: 1px dashed var(--brand); cursor: pointer; }
  .src-link:hover { color: var(--brand-dim); }
  .src-none { font-size: 11.5px; color: #9aa7b4; }
  .tabs { display: flex; gap: 8px; margin: 16px 0; }
  .tab { font: inherit; font-size: 14px; padding: 8px 18px; color: var(--brand);
    background: #fff; border: 2px solid var(--ink); border-radius: 3px; cursor: pointer; }
  .tab.active { background: var(--brand); color: #fff; border-color: var(--brand-dim); }
  table.eval { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.eval th, table.eval td { border: 1px solid #cdd9e4; padding: 6px 8px; text-align: center; }
  table.eval th { background: #f0f7fd; }
  .eval-bucket { margin: 12px 0; }
  .eval-bucket h3 { font-size: 14px; margin: 0 0 6px; }
  .eval-bars { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
  .eval-bar-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .eval-bar-label { width: 110px; text-align: right; flex-shrink: 0; color: #40586e; }
  .eval-bar-track { flex: 1; height: 18px; background: #eef4fa; border-radius: 3px; overflow: hidden; }
  .eval-bar-fill { height: 100%; background: var(--brand); border-radius: 3px; }
  .eval-bar-val { width: 48px; font-weight: 700; flex-shrink: 0; }
  .eval-chart-note { font-size: 11px; color: #9aa7b4; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="avatar">📚</div>
    <h1>知识库管理</h1>
    <div class="spacer"></div>
    <a href="/">← 回聊天</a>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="入库" type="button">入库</button>
    <button class="tab" data-tab="评测" type="button">评测</button>
  </nav>

  <div id="tab-入库">
  <div class="stats" id="stats">
    <div class="stat"><div class="n" id="st-total">–</div><div class="l">总块数</div></div>
    <div class="stat"><div class="n" id="st-done">–</div><div class="l">已向量化</div></div>
    <div class="stat"><div class="n" id="st-pending">–</div><div class="l">待向量化</div></div>
    <div class="stat"><div class="n" id="st-milvus">–</div><div class="l">Milvus 条数</div></div>
  </div>

  <div class="card">
    <h2>文档</h2>
    <ul class="doc-list" id="doc-list"></ul>
    <div class="pre" id="doc-view" style="display:none;margin-top:10px"></div>
  </div>

  <div class="card">
    <h2>在线检索</h2>
    <div style="display:flex;gap:10px">
      <input type="text" id="search-input" placeholder="输入问题,检索相关知识…" style="flex:1">
      <button id="search-btn">检索</button>
    </div>
    <div id="search-results" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <h2>上传文档(Markdown)</h2>
    <div class="form-row">
      <label>文件名 <input type="text" id="up-name" placeholder="例如 退换货补充.md"></label>
      <label>类型
        <select id="up-type">
          <option value="policy">policy · 政策</option>
          <option value="faq">faq · 常见问题</option>
          <option value="manual">manual · 手册</option>
        </select>
      </label>
      <label>从文件读取 <input type="file" id="up-file" accept=".md"></label>
    </div>
    <textarea id="up-content" placeholder="粘贴 Markdown 内容(首行无需写类型标记,系统自动注入)"></textarea>
    <div style="margin-top:10px;display:flex;gap:10px;align-items:center">
      <button id="up-submit">上传</button>
      <span class="muted" id="up-msg"></span>
    </div>
  </div>

  <div class="card">
    <h2>任务</h2>
    <div style="display:flex;gap:10px">
      <button id="job-vectorize">向量化</button>
      <button id="job-mine" class="secondary">从会话挖知识</button>
    </div>
    <div class="job-status" id="job-status" style="display:none"></div>
    <div id="job-result"></div>
  </div>
  </div>

  <div id="tab-评测" style="display:none">
    <div class="card">
      <h2>检索评测(四策略对比)</h2>
      <div style="display:flex;gap:10px;align-items:center">
        <button id="eval-refresh">刷新结果</button>
        <span class="muted">评测由 <code>scripts/run_eval.py</code> 跑出,这里读取最近一次结果</span>
      </div>
      <div id="eval-results" style="margin-top:10px"></div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);

  async function api(path, opts) {
    const resp = await fetch(path, opts);
    if (resp.status === 409) throw new Error("已有任务在跑,或同名文档已存在");
    if (!resp.ok) {
      let msg = `HTTP ${resp.status}`;
      try { msg = (await resp.json()).detail || msg; } catch {}
      throw new Error(msg);
    }
    return resp.json();
  }

  // ── 统计与文档列表 ──
  async function refreshStats() {
    try {
      const s = await api("/api/kb/stats");
      $("st-total").textContent = s.total;
      $("st-done").textContent = s.done;
      $("st-pending").textContent = s.pending;
      $("st-milvus").textContent = s.milvus_count == null ? "不可用" : s.milvus_count;
    } catch (e) { /* 静默:管理页不因 stats 失败崩掉 */ }
  }

  async function refreshDocs() {
    const list = await api("/api/kb/documents");
    const ul = $("doc-list");
    ul.replaceChildren();
    for (const d of list) {
      const li = document.createElement("li");
      const name = document.createElement("span");
      name.className = "name"; name.textContent = d.name;
      const tag = document.createElement("span");
      tag.className = "tag"; tag.textContent = d.type;
      const meta = document.createElement("span");
      meta.className = "muted"; meta.textContent = `${d.title} · ${d.chunk_count} 块`;
      li.append(name, tag, meta);
      li.onclick = () => viewDoc(d.name);
      ul.appendChild(li);
    }
    if (!list.length) {
      const li = document.createElement("li");
      li.className = "muted"; li.textContent = "(暂无文档)";
      ul.appendChild(li);
    }
  }

  async function viewDoc(name) {
    const d = await api(`/api/kb/documents/${encodeURIComponent(name)}`);
    const v = $("doc-view");
    v.style.display = "block";
    v.textContent = d.content;
  }

  // ── 检索 ──
  function renderSearchResults(results) {
    const box = $("search-results");
    box.replaceChildren();
    if (!results.length) {
      const p = document.createElement("div");
      p.className = "muted";
      p.textContent = "(没有召回到相关内容)";
      box.appendChild(p);
      return;
    }
    for (const r of results) {
      const item = document.createElement("div");
      item.className = "qa-item";
      const q = document.createElement("div"); q.className = "q"; q.textContent = r.question;
      const a = document.createElement("div"); a.className = "a"; a.textContent = r.answer;
      const meta = document.createElement("div"); meta.className = "meta";
      const c = document.createElement("span"); c.className = "c"; c.textContent = r.category;
      meta.appendChild(c);
      if (r.section_path) {
        const sp = document.createElement("span"); sp.className = "muted"; sp.textContent = r.section_path;
        meta.appendChild(sp);
      }
      if (r.document) {
        const link = document.createElement("a");
        link.className = "src-link";
        link.textContent = `查看原文:${r.document}`;
        link.onclick = () => viewDoc(r.document);
        meta.appendChild(link);
      } else {
        const none = document.createElement("span");
        none.className = "src-none";
        none.textContent = "(对话挖矿 / FAQ 迁移来源,无原文)";
        meta.appendChild(none);
      }
      item.append(q, a, meta);
      box.appendChild(item);
    }
  }

  async function doSearch() {
    const q = $("search-input").value.trim();
    if (!q) return;
    $("search-btn").disabled = true;
    try {
      const results = await api(`/api/kb/search?q=${encodeURIComponent(q)}`);
      renderSearchResults(results);
    } catch (e) {
      const box = $("search-results");
      box.replaceChildren();
      const p = document.createElement("div");
      p.className = "muted";
      p.textContent = `⚠ ${e.message}`;
      box.appendChild(p);
    } finally {
      $("search-btn").disabled = false;
    }
  }

  $("search-btn").addEventListener("click", doSearch);
  $("search-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") doSearch();
  });

  // ── 上传 ──
  $("up-file").addEventListener("change", async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    if (!$("up-name").value) $("up-name").value = f.name;
    $("up-content").value = await f.text();
  });

  $("up-submit").addEventListener("click", async () => {
    const filename = $("up-name").value.trim();
    const type = $("up-type").value;
    const content = $("up-content").value;
    if (!filename || !content) { $("up-msg").textContent = "文件名与内容不能为空"; return; }
    $("up-submit").disabled = true;
    $("up-msg").textContent = "上传中…";
    try {
      const r = await api("/api/kb/documents", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ filename, type, content }),
      });
      $("up-msg").textContent = `✓ 入库 ${r.chunks_added} 块(跳过 ${r.chunks_skipped}),记得点「向量化」`;
      $("up-content").value = ""; $("up-name").value = "";
      await refreshDocs(); await refreshStats();
    } catch (e) {
      $("up-msg").textContent = `⚠ ${e.message}`;
    } finally {
      $("up-submit").disabled = false;
    }
  });

  // ── 任务 ──
  let pollTimer = null;

  function renderJobResult(result) {
    const box = $("job-result");
    box.replaceChildren();
    if (!result || !result.kept_qa) return;
    const h = document.createElement("div");
    h.className = "muted";
    h.textContent = `抽 ${result.extracted} 条 · 保留 ${result.kept} · 丢弃 ${result.discarded} · 入库 ${result.inserted}`;
    box.appendChild(h);
    for (const qa of result.kept_qa) {
      const item = document.createElement("div");
      item.className = "qa-item";
      const q = document.createElement("div"); q.className = "q"; q.textContent = qa.question;
      const a = document.createElement("div"); a.className = "a"; a.textContent = qa.answer;
      const c = document.createElement("div"); c.className = "c"; c.textContent = qa.category;
      item.append(q, a, c);
      box.appendChild(item);
    }
  }

  function pollJob(jobId) {
    clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      try {
        const j = await api(`/api/kb/jobs/${jobId}`);
        const st = $("job-status");
        st.style.display = "block";
        st.className = "job-status " + j.status;
        st.textContent = `[${j.status}] ${j.message || ""}`;
        if (j.status !== "running") {
          clearInterval(pollTimer);
          renderJobResult(j.result);
          await refreshStats();
        }
      } catch (e) {
        clearInterval(pollTimer);
        $("job-status").textContent = `⚠ ${e.message}`;
      }
    }, 1000);
  }

  async function startJob(type) {
    try {
      $("job-status").style.display = "block";
      $("job-status").className = "job-status";
      $("job-status").textContent = "提交中…";
      const r = await api(`/api/kb/jobs/${type}`, { method: "POST" });
      pollJob(r.job_id);
    } catch (e) {
      $("job-status").className = "job-status failed";
      $("job-status").textContent = `⚠ ${e.message}`;
    }
  }

  $("job-vectorize").addEventListener("click", () => startJob("vectorize"));
  $("job-mine").addEventListener("click", () => startJob("mine"));

  // ── 标签页切换 ──
  function switchTab(name) {
    for (const b of document.querySelectorAll(".tab")) {
      b.classList.toggle("active", b.dataset.tab === name);
    }
    $("tab-入库").style.display = (name === "入库") ? "block" : "none";
    $("tab-评测").style.display = (name === "评测") ? "block" : "none";
  }
  for (const b of document.querySelectorAll(".tab")) {
    b.addEventListener("click", () => switchTab(b.dataset.tab));
  }

  // ── 评测结果 ──
  const BUCKET_LABELS = {
    A_policy: "政策", B_model: "型号", C_colloquial: "口语",
    D_absent: "应拒答", E_multi: "多跳",
  };
  function renderEval(data) {
    const box = $("eval-results");
    box.replaceChildren();
    const strategies = Object.keys(data.strategies || {});
    if (!strategies.length) {
      box.innerHTML = '<div class="muted">暂无结果,请先运行 scripts/run_eval.py</div>';
      return;
    }
    const buckets = [...new Set(
      strategies.flatMap((s) => Object.keys(data.strategies[s])))];
    for (const bucket of buckets) {
      const wrap = document.createElement("div");
      wrap.className = "eval-bucket";
      const h = document.createElement("h3");
      h.textContent = BUCKET_LABELS[bucket] || bucket;
      wrap.appendChild(h);

      // ── MRR 柱状图(横向条,长度 ∝ MRR)──
      const note = document.createElement("div");
      note.className = "eval-chart-note";
      note.textContent = "MRR(平均倒数排名,越高越好)";
      wrap.appendChild(note);
      const bars = document.createElement("div");
      bars.className = "eval-bars";
      const mrrVals = strategies.map((s) => ((data.strategies[s] || {})[bucket] || {}).mrr || 0);
      const maxMrr = Math.max(...mrrVals, 0.0001);
      for (const s of strategies) {
        const r = (data.strategies[s] || {})[bucket];
        if (!r) continue;
        const row = document.createElement("div");
        row.className = "eval-bar-row";
        const label = document.createElement("span");
        label.className = "eval-bar-label";
        label.textContent = s;
        const track = document.createElement("div");
        track.className = "eval-bar-track";
        const fill = document.createElement("div");
        fill.className = "eval-bar-fill";
        fill.style.width = `${((r.mrr / maxMrr) * 100).toFixed(1)}%`;
        track.appendChild(fill);
        const val = document.createElement("span");
        val.className = "eval-bar-val";
        val.textContent = r.mrr.toFixed(3);
        row.append(label, track, val);
        bars.appendChild(row);
      }
      wrap.appendChild(bars);

      // ── 数值表(强化)──
      const table = document.createElement("table");
      table.className = "eval";
      table.innerHTML =
        "<tr><th>策略</th><th>Recall@10</th><th>MRR</th><th>置信度</th><th>应答正确</th></tr>";
      for (const s of strategies) {
        const r = (data.strategies[s] || {})[bucket];
        if (!r) continue;
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${s}</td><td>${r["recall@10"]}</td><td>${r["mrr"]}</td>` +
          `<td>${r["conf"]}</td><td>${r["answer_ok"]}</td>`;
        table.appendChild(tr);
      }
      wrap.appendChild(table);
      box.appendChild(wrap);
    }
  }
  async function refreshEval() {
    try {
      renderEval(await api("/api/kb/eval"));
    } catch (e) {
      $("eval-results").innerHTML = `<div class="muted">⚠ ${e.message}</div>`;
    }
  }
  $("eval-refresh").addEventListener("click", refreshEval);

  // ── 初始 ──
  refreshStats();
  refreshDocs();
})();
</script>
</body>
</html>
