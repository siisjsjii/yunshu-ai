<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小喵 · 智能客服</title>
<style>
  :root {
    --bg:        #e8f2fb;   /* 浅蓝底 */
    --bg-line:   #d3e6f7;   /* 网格线 */
    --brand:     #2f6fb0;   /* 顶栏 / 用户气泡 / 发送键 */
    --brand-dim: #245a90;
    --ink:       #1c2b39;
    --bubble:    #ffffff;
    --badge:     #4a7fb5;
    --warn:      #c2570f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    /* 网格纸质感,比纯色更像原型 */
    background-image:
      linear-gradient(var(--bg-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-line) 1px, transparent 1px);
    background-size: 22px 22px;
  }

  .app {
    width: 100%;
    max-width: 720px;
    height: min(88vh, 860px);
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border: 3px solid var(--brand);
    border-radius: 4px;
    box-shadow: 8px 8px 0 rgba(47, 111, 176, .18);
    overflow: hidden;
  }

  /* ── 顶栏 ── */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--brand);
    color: #fff;
  }
  .avatar {
    width: 40px; height: 40px;
    flex: 0 0 auto;
    display: grid; place-items: center;
    font-size: 22px;
    background: #fff;
    border-radius: 4px;
  }
  .title { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
  .subtitle {
    font-size: 11px;
    letter-spacing: 1.5px;
    opacity: .85;
    margin-top: 2px;
  }
  header .spacer { flex: 1; }
  #new-chat {
    font: inherit;
    font-size: 13px;
    padding: 7px 14px;
    color: var(--brand);
    background: #fff;
    border: 2px solid #fff;
    border-radius: 3px;
    cursor: pointer;
  }
  #new-chat:hover { background: #dcebf9; }
  #new-chat:disabled { opacity: .5; cursor: default; }

  /* ── 对话区 ── */
  #log {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row.user { justify-content: flex-end; }

  .bubble {
    max-width: 78%;
    padding: 11px 14px;
    line-height: 1.65;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--bubble);
    border: 2px solid var(--ink);
    border-radius: 3px;
  }
  .row.user .bubble {
    background: var(--brand);
    border-color: var(--brand-dim);
    color: #fff;
  }
  .row.assistant .bubble { margin-bottom: 2px; }

  .mini-avatar {
    width: 28px; height: 28px;
    flex: 0 0 auto;
    display: grid; place-items: center;
    font-size: 15px;
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 3px;
  }

  /* ── 工具轨迹徽章 ── */
  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    padding: 3px 10px;
    color: var(--badge);
    background: #fff;
    border: 1.5px dashed var(--badge);
    border-radius: 999px;
  }
  .badge.failed {
    color: var(--warn);
    border-color: var(--warn);
  }
  .badge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    animation: pulse 1s ease-in-out infinite;
  }
  .badge.settled .dot { animation: none; }
  @keyframes pulse { 50% { opacity: .25; } }

  .error { color: #b00020; }
  .feedback { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .fb { font: inherit; font-size: 13px; padding: 3px 8px; background: #fff;
    border: 1.5px solid #cdd9e4; border-radius: 999px; cursor: pointer; }
  .fb.active { background: var(--brand); border-color: var(--brand-dim); }
  .fb-state { font-size: 11.5px; color: #5b7186; }
  .choices { display: flex; gap: 8px; margin-top: 10px; }
  .choice-btn {
    background: #fff; color: var(--brand); border: 1.5px solid var(--brand);
    border-radius: 999px; padding: 5px 14px; font-size: 13px; cursor: pointer;
  }
  .choice-btn:hover:not(:disabled) { background: #dcebf9; }
  .choice-btn:disabled { opacity: .6; cursor: default; }
  .orders { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .orders-title { font-size: 12.5px; color: #5b7186; }
  .order-card { display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    background: #fff; border: 1.5px solid #cdd9e4; border-radius: 8px;
    padding: 8px 12px; cursor: pointer; text-align: left; font: inherit; }
  .order-card:hover:not(:disabled) { border-color: var(--brand); background: #f2f8fd; }
  .order-card:disabled { opacity: .55; cursor: default; }
  .order-card.picked { border-color: var(--brand); background: #dcebf9; opacity: 1; }
  .order-no { font-weight: 700; color: var(--ink); font-size: 13.5px; }
  .order-meta { font-size: 12px; color: #5b7186; }
  .refund-form { margin-top: 10px; border: 1.5px dashed #cdd9e4; border-radius: 8px;
    padding: 10px 12px; background: #fbfdff; }
  .refund-title { font-weight: 700; font-size: 13px; margin-bottom: 8px; }
  .refund-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .refund-reason { font: inherit; padding: 4px 6px; border: 1.5px solid #cdd9e4;
    border-radius: 6px; background: #fff; }
  .refund-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .refund-submit { background: var(--brand); color: #fff; border: none; border-radius: 999px;
    padding: 6px 16px; font-size: 13px; cursor: pointer; }
  .refund-submit:disabled { opacity: .6; cursor: default; }
  .refund-state { font-size: 12px; color: #5b7186; }
  .row.system .bubble { background: #eef4fa; color: #5b7186; border-style: dashed; }
  .cite { color: var(--brand); text-decoration: none; font-weight: 700;
    border-bottom: 1px dashed var(--brand); cursor: pointer; padding: 0 1px; }
  .cite-pop { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    max-width: 720px; width: min(720px, 92vw); max-height: 78vh; overflow: auto;
    background: #fff; border: 2px solid var(--ink); border-radius: 4px;
    padding: 14px 16px; box-shadow: 6px 6px 0 rgba(28,43,57,.15); z-index: 999;
    cursor: default; font-size: 13.5px; line-height: 1.6; }
  .cite-path { color: var(--brand); font-weight: 700; margin-bottom: 8px; }
  .cite-answer { white-space: pre-wrap; word-break: break-word; }
  .cite-close { position: absolute; top: 8px; right: 12px; cursor: pointer;
    color: #5b7186; font-size: 18px; line-height: 1; }
  .cite-note { margin-top: 8px; font-size: 12px; color: #5b7186; }
  .cite-doc { white-space: pre-wrap; word-break: break-word; margin-top: 6px;
    border-top: 1px dashed #cdd9e4; padding-top: 8px; }
  .cite-doc mark { background: #ffe9a8; padding: 0 1px; }
  .cite-hit { background: #dcebf9; border-left: 3px solid var(--brand);
    padding: 6px 8px; margin: 6px 0; }

  /* ── 底栏 ── */
  footer {
    flex: 0 0 auto;
    padding: 12px 16px 10px;
    background: var(--bg);
    border-top: 2px solid var(--brand);
  }
  .composer { display: flex; gap: 10px; }
  #input {
    flex: 1;
    font: inherit;
    font-size: 14px;
    padding: 11px 13px;
    color: var(--ink);
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 3px;
    resize: none;
    min-height: 46px;
    max-height: 132px;
  }
  #input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  #send {
    flex: 0 0 auto;
    width: 52px;
    font-size: 20px;
    color: #fff;
    background: var(--brand);
    border: 2px solid var(--brand-dim);
    border-radius: 3px;
    cursor: pointer;
  }
  #send:hover:not(:disabled) { background: var(--brand-dim); }
  #send:disabled { opacity: .45; cursor: default; }

  .footnote {
    margin: 8px 0 0;
    text-align: center;
    font-size: 11.5px;
    color: #5b7186;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">🐱</div>
    <div>
      <div class="title">小喵 · 智能客服</div>
      <div class="subtitle">ONLINE · 云枢</div>
    </div>
    <div class="spacer"></div>
    <a href="/admin.html" style="font:inherit;font-size:13px;padding:7px 14px;color:#fff;
       text-decoration:none;border:2px solid #fff;border-radius:3px;">知识库</a>
    <button id="new-chat" type="button">＋ 新对话</button>
  </header>

  <main id="log"></main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1"
        placeholder="输入消息,和小喵聊聊吧~(回车发送 / Shift+回车换行)"></textarea>
      <button id="send" type="button" aria-label="发送">➤</button>
    </div>
    <p class="footnote">小喵是 AI 助手,涉及具体订单会为你转接人工核实</p>
  </footer>
</div>

<script>
(() => {
  "use strict";

  const logEl   = document.getElementById("log");
  const inputEl = document.getElementById("input");
  const sendEl  = document.getElementById("send");
  const newEl   = document.getElementById("new-chat");

  let sessionId = null;   // 由首帧 meta 回传,后续轮次复用
  let busy      = false;

  // ── 渲染 ──────────────────────────────────────────────

  function scrollToEnd() {
    logEl.scrollTop = logEl.scrollHeight;
  }

  function addRow(role) {
    const row = document.createElement("div");
    row.className = `row ${role}`;
    if (role === "assistant") {
      const av = document.createElement("div");
      av.className = "mini-avatar";
      av.textContent = "🐱";
      row.appendChild(av);
    }
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    row.appendChild(bubble);
    logEl.appendChild(row);
    scrollToEnd();
    return bubble;
  }

  function addUser(text) {
    addRow("user").textContent = text;
  }

  // 助手气泡 = 徽章区 + 正文,正文边流边追加
  function addAssistant() {
    const bubble = addRow("assistant");
    const badges = document.createElement("div");
    badges.className = "badges";
    const body = document.createElement("div");
    bubble.append(badges, body);
    // 满意度反馈(纯前端采集,一次性锁定)
    const fb = document.createElement("div");
    fb.className = "feedback";
    fb.innerHTML =
      '<button class="fb" data-v="up" type="button">👍</button>' +
      '<button class="fb" data-v="down" type="button">👎</button>' +
      '<span class="fb-state"></span>';
    bubble.appendChild(fb);
    let locked = false;
    fb.querySelectorAll(".fb").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (locked) return;
        locked = true;
        fb.querySelectorAll(".fb").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        fb.querySelector(".fb-state").textContent = "已反馈";
      });
    });
    return { bubble, badges, body, citations: [] };
  }

  function addBadge(badges, name) {
    const el = document.createElement("span");
    el.className = "badge";
    el.dataset.tool = name;
    // 圆点承载状态(进行中脉动 / 返回后停),🔧 是原型里的工具图标
    el.innerHTML = '<span class="dot"></span><span aria-hidden="true">🔧</span>';
    el.appendChild(document.createTextNode(`调用了 ${name}`));
    badges.appendChild(el);
    scrollToEnd();
    return el;
  }

  function settleBadge(badges, name, ok) {
    // 拿最后一个同名且未结算的徽章 —— 同一轮可能调多次同名工具
    const el = [...badges.querySelectorAll(`.badge[data-tool="${CSS.escape(name)}"]`)]
      .filter((b) => !b.classList.contains("settled"))
      .pop();
    if (!el) return;
    el.classList.add("settled");
    if (!ok) el.classList.add("failed");
  }

  // ── SSE ───────────────────────────────────────────────
  //
  // 不能用 EventSource:它只支持 GET,而接口是 POST。
  // 所以走 fetch + ReadableStream,手工按 SSE 分帧解析。

  function handleBlock(block, ctx) {
    let event = null;
    let data  = null;
    for (const line of block.split("\n")) {
      if (line.startsWith("event: "))      event = line.slice(7).trim();
      else if (line.startsWith("data: "))  data  = line.slice(6);
    }
    if (!event || data === null) return;

    let payload;
    try { payload = JSON.parse(data); } catch { return; }

    switch (event) {
      case "meta":
        if (payload.session_id) sessionId = payload.session_id;
        break;
      case "tool_call":
        addBadge(ctx.badges, payload.name);
        break;
      case "tool_result":
        settleBadge(ctx.badges, ctx.lastTool, payload.ok);
        break;
      case "token":
        ctx.body.textContent += payload.text || "";
        scrollToEnd();
        break;
      case "citations":
        ctx.citations = payload.items || [];
        break;
      case "choices":
        renderChoices(ctx.bubble, payload.options || []);
        break;
      case "order_choice":
        ctx.suspended = true;          // 本轮是挂起,不是答完 —— 见 streamInto 的说明
        renderOrderCards(ctx, payload.options || []);
        break;
      case "refund_offer":
        renderRefundForm(ctx, payload);
        break;
      case "error":
        ctx.failed = true;
        const p = document.createElement("div");
        p.className = "error";
        p.textContent = `⚠️ ${payload.message || "服务暂时不可用"}`;
        ctx.bubble.appendChild(p);
        scrollToEnd();
        break;
    }
  }

  async function send(text) {
    const ctx = { ...addAssistant(), lastTool: null, failed: false };
    await streamInto(ctx, sessionId ? { session_id: sessionId, message: text }
                                    : { message: text });
  }

  // 从挂起点续跑(ch06):订单卡片点选后走这里。
  // **复用同一个 ctx** —— 回复要接着流进**同一个气泡**,不是新起一条。
  async function resumeWith(resumeBody, ctx) {
    await streamInto(ctx, { session_id: sessionId, resume: resumeBody });
  }

  async function streamInto(ctx, body) {
    busy = true;
    sendEl.disabled = true;
    inputEl.disabled = true;
    // 本轮是否「挂起」而不是「答完了」。**这个标志是必须的**:
    // ch06 的子流程在缺订单号时会 `interrupt()`,那一轮**一个 token 帧都不发**
    // (卡片挂在 ctx.bubble 上,不是 ctx.body)。而下面的 finally 会在 body 为空时
    // 写一句「(没有返回内容)」—— 然后 resume 复用**同一个 ctx**、token 走 `+=`,
    // 于是恢复后的回复前面会**永久粘着那句占位符**。
    // 每次 streamInto 都重置:resume 那一次同样要按新的一轮重新判定。
    ctx.suspended = false;

    try {
      const resp = await fetch("/api/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      if (!resp.ok || !resp.body) {
        throw new Error(`HTTP ${resp.status}`);
      }

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        // stream:true 是关键 —— 不加的话,多字节中文会在 chunk 边界被切断成乱码,
        // 而 SSE 分片与 UTF-8 字符边界毫无关系。
        buffer += decoder.decode(value, { stream: true });

        let cut;
        while ((cut = buffer.indexOf("\n\n")) !== -1) {
          const block = buffer.slice(0, cut);
          buffer = buffer.slice(cut + 2);
          const before = ctx.badges.querySelectorAll(".badge").length;
          handleBlock(block, ctx);
          if (ctx.badges.querySelectorAll(".badge").length > before) {
            ctx.lastTool = ctx.badges.querySelector(".badge:last-child").dataset.tool;
          }
        }
      }
    } catch (err) {
      const p = document.createElement("div");
      p.className = "error";
      p.textContent = `⚠️ 连接中断(${err.message})`;
      ctx.bubble.appendChild(p);
    } finally {
      // 挂起的那一轮**不该**写这句:它没答完,只是在等用户点订单卡片。
      // 写了它,resume 之后那句会粘在真正的回复前面(见 streamInto 顶部的说明)。
      if (!ctx.body.textContent.trim() && !ctx.failed && !ctx.suspended) {
        ctx.body.textContent = "(没有返回内容)";
      }
      makeCitesClickable(ctx);
      busy = false;
      sendEl.disabled = false;
      inputEl.disabled = false;
      inputEl.focus();
    }
  }

  // 把回复里的 [n] 换成可点的引用标记,点开弹出来源 chunk 原文 + 章节路径。
  function makeCitesClickable(ctx) {
    if (!ctx.citations || !ctx.citations.length) return;
    const text = ctx.body.textContent;
    if (!/\[\d+\]/.test(text)) return;
    ctx.body.innerHTML = text.replace(/\[\d+\]/g, (m) => {
      const n = parseInt(m.slice(1, -1), 10);
      const c = ctx.citations.find((x) => x.n === n);
      if (!c) return m;
      return `<a class="cite" data-n="${n}" title="${c.section_path || c.category}">${m}</a>`;
    });
    ctx.body.querySelectorAll(".cite").forEach((a) => {
      a.addEventListener("click", () => {
        const c = ctx.citations.find((x) => x.n === parseInt(a.dataset.n, 10));
        if (!c) return;
        showCitation(c);
      });
    });
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // 文档列表只在**第一次点引用**时拉一次并缓存 —— 它要给每个文件重新切分算
  // chunk_count,不该在页面加载时就付这个代价。
  //
  // ⚠️ 反查口径(实测 2026-09-20,别想当然):
  // 要用 **`section_path` 的首段**,不是 `category`。`section_path` 形如
  // `退货退款政策 > 无理由退货 > 适用范围`,首段就是源文档的 H1 标题
  // (→ 退货政策.md、售后手册.md、商品与购物 FAQ → 商品FAQ.md)。
  // 而 `category` 是**主题标签**,不是文档名 —— 实测「退货政策是怎么规定的」
  // 那 3 条引用里,按 category 匹配文档 **0/3 命中**(它是「退换货」),
  // 按 section_path 首段匹配才命中。
  // 另有块**根本没有 section_path**(FAQ 迁移 / 对话挖矿来的),那是**正常**的 ——
  // 它们没有源文件,走片段回退。
  let docListPromise = null;
  function loadDocList() {
    if (!docListPromise) {
      docListPromise = fetch("/api/kb/documents")
        .then((r) => (r.ok ? r.json() : []))
        .catch(() => []);
    }
    return docListPromise;
  }

  // 源文档标题 = section_path 的首段(见上面那段实测说明)。
  // section_path 为空时退回 category —— 对没有源文件的块,两者都匹配不上,
  // 结果是同一个(走片段回退),但 category 至少能让提示文案更像样。
  function docTitleOf(c) {
    const first = (c.section_path || "").split(" > ")[0].trim();
    return first || (c.category || "").trim() || null;
  }

  // 在整篇原文里定位命中章节:优先按 section_path 的**末段**(章节名)找标题行,
  // 找不到再退回命中块的 answer 原文。返回 [html, 是否定位到]。
  function locateInDoc(content, c) {
    // ⚠️ 取**最后一段**,不是把中间几段拼起来。
    // section_path 的层数不定:`售后手册 > 保修说明`(两层)与
    // `退货退款政策 > 无理由退货 > 适用范围`(三层)都真实存在,
    // 而文档里的标题行**只有末段那个名字**(`### 适用范围`)。
    // 拼中间段去找 → 永远找不到,而且是**静默**找不到(只是没有高亮)。
    const parts = (c.section_path || "").split(" > ").map((s) => s.trim()).filter(Boolean);
    const section = parts.length ? parts[parts.length - 1] : "";
    const lines = content.split("\n");
    let hitIdx = -1;
    if (section) {
      hitIdx = lines.findIndex((l) => /^#{1,6}\s/.test(l) && l.includes(section));
    }
    const chunkHit = c.answer && content.includes(c.answer);
    let chunkMd = "";
    if (chunkHit) {
      // 块原文在文档里逐字存在(语料块就是这么切出来的)→ 整段高亮
      chunkMd = `<div class="cite-hit">${esc(c.answer)}</div>`;
    }
    const html = lines.map((l, i) => {
      const isHit = i === hitIdx;
      const body = isHit ? `<mark>${esc(l)}</mark>` : esc(l);
      return isHit ? `<span id="citeAnchor">${body}</span>` : body;
    }).join("\n");
    return [chunkMd + `<div class="cite-doc">${html}</div>`, hitIdx >= 0 || chunkHit];
  }

  async function showCitation(c) {
    const box = document.createElement("div");
    box.className = "cite-pop";
    const head = `<span class="cite-close" title="关闭">×</span>
      <div class="cite-path">${esc(c.section_path || c.category || "来源")}</div>`;
    box.innerHTML = `${head}<div class="cite-answer">正在载入源文档…</div>`;
    box.querySelector(".cite-close").addEventListener("click", () => box.remove());
    document.body.appendChild(box);

    const docs = await loadDocList();
    const docTitle = docTitleOf(c);
    const hit = docTitle ? docs.find((d) => d.title === docTitle) : null;
    if (!hit) {
      // 没有源文件 —— 如实说明,并把命中块原文给出来,不假装有文档
      box.innerHTML = `${head}<div class="cite-answer">${esc(c.answer)}</div>
        <div class="cite-note">该条来自 FAQ 迁移或对话挖矿,没有对应的源文档;
        以上是命中的知识块原文。</div>`;
      return;
    }
    try {
      const r = await fetch(`/api/kb/documents/${encodeURIComponent(hit.name)}`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const d = await r.json();
      const [body, located] = locateInDoc(d.content || "", c);
      box.innerHTML = `${head}${body}
        <div class="cite-note">源文档:${esc(hit.name)}${located ? "(已定位并高亮命中处)" : "(未能定位到具体章节,已给出全文)"}</div>`;
      const anchor = box.querySelector("#citeAnchor");
      if (anchor) anchor.scrollIntoView({ block: "center" });
    } catch (err) {
      box.innerHTML = `${head}<div class="cite-answer">${esc(c.answer)}</div>
        <div class="cite-note">源文档载入失败(${esc(err.message)}),以上是命中的知识块原文。</div>`;
    }
  }

  // ── 订单选择器(ch06 退款子流程)─────────────────────

  // 后端在子流程里 `interrupt()` 时发来的一帧:该填订单号了。
  // 点选后带订单号发 resume,流程从断点接着走 —— 回复流进**同一个气泡**。
  //
  // 兼容两种载荷形状:后端给字符串数组(order_no)或对象数组
  // (order_no + status/product/amount)。**不假设哪一种**,免得耦合到
  // 后端某一版的实现细节上。
  function renderOrderCards(ctx, options) {
    const box = document.createElement("div");
    box.className = "orders";
    const title = document.createElement("div");
    title.className = "orders-title";
    title.textContent = "请选择要处理的订单:";
    box.appendChild(title);

    options.forEach((o) => {
      const no = typeof o === "string" ? o : (o.order_no || "");
      if (!no) return;
      const meta = typeof o === "string"
        ? ""
        : [o.product, o.status, o.amount].filter(Boolean).join(" · ");
      const card = document.createElement("button");
      card.type = "button";
      card.className = "order-card";
      card.innerHTML = `<span class="order-no">${esc(no)}</span>` +
        (meta ? `<span class="order-meta">${esc(meta)}</span>` : "");
      card.addEventListener("click", () => {
        // 一次性锁定:已选过就不再让点第二张
        box.querySelectorAll(".order-card").forEach((b) => (b.disabled = true));
        card.classList.add("picked");
        resumeWith({ order_no: no }, ctx);
      });
      box.appendChild(card);
    });

    ctx.bubble.appendChild(box);
    scrollToEnd();
  }

  // ── 退款表单(ch06)──────────────────────────────────
  //
  // 类目**从帧里来**(`payload.categories`),前端**不硬编码** ——
  // 后端 `app/refund/categories.py` 是那份清单的唯一来源,
  // 两处各写一份迟早漂移,而漂移的表现是:表单能选,提交回 422。
  function renderRefundForm(ctx, payload) {
    const box = document.createElement("div");
    box.className = "refund-form";
    const cats = payload.categories || [];
    const orderNo = payload.order_no || "";

    box.innerHTML = `
      <div class="refund-title">提交退款申请${orderNo ? `(订单 ${esc(orderNo)})` : ""}</div>
      <label class="refund-row">退款原因
        <select class="refund-reason">
          ${cats.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join("")}
        </select>
      </label>
      <div class="refund-actions">
        <button type="button" class="refund-submit">提交退款单</button>
        <span class="refund-state"></span>
      </div>`;

    const btn = box.querySelector(".refund-submit");
    const sel = box.querySelector(".refund-reason");
    const st = box.querySelector(".refund-state");

    btn.addEventListener("click", async () => {
      if (btn.disabled) return;
      btn.disabled = true;              // 一次性锁定:这是**非幂等写**,重复提交会出两张单
      st.textContent = "提交中…";
      try {
        const r = await fetch("/api/refund", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            session_id: sessionId, order_no: orderNo, reason_category: sel.value,
          }),
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const d = await r.json();
        st.textContent = "已提交";
        appendSystem(`退款单已提交:订单 ${d.order_no} · ${d.reason_category}`);
      } catch (e) {
        btn.disabled = false;           // 失败才放开,让用户能重试
        st.textContent = `提交失败(${e.message})`;
      }
    });

    ctx.bubble.appendChild(box);
    scrollToEnd();
  }

  // ── 选项按钮(投诉场景)──────────────────────────────

  // 「转人工」「建工单」是**两件事**,分开渲染成两个独立按钮,互不绑定。
  // 都不点、继续发消息 → 一切照常,后端不会被调用。
  function renderChoices(bubble, options) {
    const bar = document.createElement("div");
    bar.className = "choices";
    options.forEach((opt) => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.dataset.key = opt.key;
      btn.textContent = opt.label;
      btn.addEventListener("click", () => onChoice(opt, btn, bar, bubble));
      bar.appendChild(btn);
    });
    bubble.appendChild(bar);
  }

  function onChoice(opt, btn, bar, bubble) {
    if (btn.disabled) return;          // 一次性锁定:同 👍/👎 的既有语义
    btn.disabled = true;
    if (opt.key === "handoff") {
      // 本章是**纯前端模拟**,不接真人系统、不调后端。
      appendSystem("已转接人工客服");
      appendAssistantText("您好,我是客服小猫,请问有什么可以帮您的");
    } else if (opt.key === "ticket") {
      createTicket(btn, bar);
    }
  }

  async function createTicket(btn, bar) {
    btn.textContent = "建单中…";
    try {
      const resp = await fetch("/api/ticket", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId }),
      });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const data = await resp.json();
      btn.textContent = "已建单 " + data.ticket_no;
    } catch (err) {
      btn.textContent = "建单失败,请重试";
      btn.disabled = false;            // 失败允许重试
    }
  }

  function appendSystem(text) {
    const row = document.createElement("div");
    row.className = "row system";
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    row.appendChild(b);
    logEl.appendChild(row);
    scrollToEnd();
  }

  function appendAssistantText(text) {
    const ctx = addAssistant();
    ctx.body.textContent = text;
    scrollToEnd();
  }

  // ── 交互 ──────────────────────────────────────────────

  function submit() {
    const text = inputEl.value.trim();
    if (!text || busy) return;
    inputEl.value = "";
    inputEl.style.height = "auto";
    addUser(text);
    send(text);
  }

  sendEl.addEventListener("click", submit);

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = `${Math.min(inputEl.scrollHeight, 132)}px`;
  });

  newEl.addEventListener("click", () => {
    if (busy) return;
    sessionId = null;
    logEl.replaceChildren();
    inputEl.focus();
  });

  inputEl.focus();
})();
</script>
</body>
</html>
