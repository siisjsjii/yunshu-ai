<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小喵 · 智能客服</title>
<style>
  :root {
    --bg:        #e8f2fb;   /* 浅蓝底 */
    --bg-line:   #d3e6f7;   /* 网格线 */
    --brand:     #2f6fb0;   /* 顶栏 / 用户气泡 / 发送键 */
    --brand-dim: #245a90;
    --ink:       #1c2b39;
    --bubble:    #ffffff;
    --badge:     #4a7fb5;
    --warn:      #c2570f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    /* 网格纸质感,比纯色更像原型 */
    background-image:
      linear-gradient(var(--bg-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-line) 1px, transparent 1px);
    background-size: 22px 22px;
  }

  .app {
    width: 100%;
    max-width: 720px;
    height: min(88vh, 860px);
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border: 3px solid var(--brand);
    border-radius: 4px;
    box-shadow: 8px 8px 0 rgba(47, 111, 176, .18);
    overflow: hidden;
  }

  /* ── 顶栏 ── */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--brand);
    color: #fff;
  }
  .avatar {
    width: 40px; height: 40px;
    flex: 0 0 auto;
    display: grid; place-items: center;
    font-size: 22px;
    background: #fff;
    border-radius: 4px;
  }
  .title { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
  .subtitle {
    font-size: 11px;
    letter-spacing: 1.5px;
    opacity: .85;
    margin-top: 2px;
  }
  header .spacer { flex: 1; }
  #new-chat {
    font: inherit;
    font-size: 13px;
    padding: 7px 14px;
    color: var(--brand);
    background: #fff;
    border: 2px solid #fff;
    border-radius: 3px;
    cursor: pointer;
  }
  #new-chat:hover { background: #dcebf9; }
  #new-chat:disabled { opacity: .5; cursor: default; }

  /* ── 对话区 ── */
  #log {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row.user { justify-content: flex-end; }

  .bubble {
    max-width: 78%;
    padding: 11px 14px;
    line-height: 1.65;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--bubble);
    border: 2px solid var(--ink);
    border-radius: 3px;
  }
  .row.user .bubble {
    background: var(--brand);
    border-color: var(--brand-dim);
    color: #fff;
  }
  .row.assistant .bubble { margin-bottom: 2px; }

  .mini-avatar {
    width: 28px; height: 28px;
    flex: 0 0 auto;
    display: grid; place-items: center;
    font-size: 15px;
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 3px;
  }

  /* ── 工具轨迹徽章 ── */
  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    padding: 3px 10px;
    color: var(--badge);
    background: #fff;
    border: 1.5px dashed var(--badge);
    border-radius: 999px;
  }
  .badge.failed {
    color: var(--warn);
    border-color: var(--warn);
  }
  .badge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    animation: pulse 1s ease-in-out infinite;
  }
  .badge.settled .dot { animation: none; }
  @keyframes pulse { 50% { opacity: .25; } }

  .error { color: #b00020; }
  .feedback { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .fb { font: inherit; font-size: 13px; padding: 3px 8px; background: #fff;
    border: 1.5px solid #cdd9e4; border-radius: 999px; cursor: pointer; }
  .fb.active { background: var(--brand); border-color: var(--brand-dim); }
  .fb-state { font-size: 11.5px; color: #5b7186; }
  .cite { color: var(--brand); text-decoration: none; font-weight: 700;
    border-bottom: 1px dashed var(--brand); cursor: pointer; padding: 0 1px; }
  .cite-pop { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    max-width: 480px; max-height: 60vh; overflow: auto; background: #fff;
    border: 2px solid var(--ink); border-radius: 4px; padding: 14px 16px;
    box-shadow: 6px 6px 0 rgba(28,43,57,.15); z-index: 999; cursor: pointer;
    font-size: 13.5px; line-height: 1.6; }
  .cite-path { color: var(--brand); font-weight: 700; margin-bottom: 8px; }
  .cite-answer { white-space: pre-wrap; word-break: break-word; }

  /* ── 底栏 ── */
  footer {
    flex: 0 0 auto;
    padding: 12px 16px 10px;
    background: var(--bg);
    border-top: 2px solid var(--brand);
  }
  .composer { display: flex; gap: 10px; }
  #input {
    flex: 1;
    font: inherit;
    font-size: 14px;
    padding: 11px 13px;
    color: var(--ink);
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 3px;
    resize: none;
    min-height: 46px;
    max-height: 132px;
  }
  #input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  #send {
    flex: 0 0 auto;
    width: 52px;
    font-size: 20px;
    color: #fff;
    background: var(--brand);
    border: 2px solid var(--brand-dim);
    border-radius: 3px;
    cursor: pointer;
  }
  #send:hover:not(:disabled) { background: var(--brand-dim); }
  #send:disabled { opacity: .45; cursor: default; }

  .footnote {
    margin: 8px 0 0;
    text-align: center;
    font-size: 11.5px;
    color: #5b7186;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">🐱</div>
    <div>
      <div class="title">小喵 · 智能客服</div>
      <div class="subtitle">ONLINE · 云枢</div>
    </div>
    <div class="spacer"></div>
    <a href="/admin.html" style="font:inherit;font-size:13px;padding:7px 14px;color:#fff;
       text-decoration:none;border:2px solid #fff;border-radius:3px;">知识库</a>
    <button id="new-chat" type="button">＋ 新对话</button>
  </header>

  <main id="log"></main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1"
        placeholder="输入消息,和小喵聊聊吧~(回车发送 / Shift+回车换行)"></textarea>
      <button id="send" type="button" aria-label="发送">➤</button>
    </div>
    <p class="footnote">小喵是 AI 助手,涉及具体订单会为你转接人工核实</p>
  </footer>
</div>

<script>
(() => {
  "use strict";

  const logEl   = document.getElementById("log");
  const inputEl = document.getElementById("input");
  const sendEl  = document.getElementById("send");
  const newEl   = document.getElementById("new-chat");

  let sessionId = null;   // 由首帧 meta 回传,后续轮次复用
  let busy      = false;

  // ── 渲染 ──────────────────────────────────────────────

  function scrollToEnd() {
    logEl.scrollTop = logEl.scrollHeight;
  }

  function addRow(role) {
    const row = document.createElement("div");
    row.className = `row ${role}`;
    if (role === "assistant") {
      const av = document.createElement("div");
      av.className = "mini-avatar";
      av.textContent = "🐱";
      row.appendChild(av);
    }
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    row.appendChild(bubble);
    logEl.appendChild(row);
    scrollToEnd();
    return bubble;
  }

  function addUser(text) {
    addRow("user").textContent = text;
  }

  // 助手气泡 = 徽章区 + 正文,正文边流边追加
  function addAssistant() {
    const bubble = addRow("assistant");
    const badges = document.createElement("div");
    badges.className = "badges";
    const body = document.createElement("div");
    bubble.append(badges, body);
    // 满意度反馈(纯前端采集,一次性锁定)
    const fb = document.createElement("div");
    fb.className = "feedback";
    fb.innerHTML =
      '<button class="fb" data-v="up" type="button">👍</button>' +
      '<button class="fb" data-v="down" type="button">👎</button>' +
      '<span class="fb-state"></span>';
    bubble.appendChild(fb);
    let locked = false;
    fb.querySelectorAll(".fb").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (locked) return;
        locked = true;
        fb.querySelectorAll(".fb").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        fb.querySelector(".fb-state").textContent = "已反馈";
      });
    });
    return { badges, body, citations: [] };
  }

  function addBadge(badges, name) {
    const el = document.createElement("span");
    el.className = "badge";
    el.dataset.tool = name;
    // 圆点承载状态(进行中脉动 / 返回后停),🔧 是原型里的工具图标
    el.innerHTML = '<span class="dot"></span><span aria-hidden="true">🔧</span>';
    el.appendChild(document.createTextNode(`调用了 ${name}`));
    badges.appendChild(el);
    scrollToEnd();
    return el;
  }

  function settleBadge(badges, name, ok) {
    // 拿最后一个同名且未结算的徽章 —— 同一轮可能调多次同名工具
    const el = [...badges.querySelectorAll(`.badge[data-tool="${CSS.escape(name)}"]`)]
      .filter((b) => !b.classList.contains("settled"))
      .pop();
    if (!el) return;
    el.classList.add("settled");
    if (!ok) el.classList.add("failed");
  }

  // ── SSE ───────────────────────────────────────────────
  //
  // 不能用 EventSource:它只支持 GET,而接口是 POST。
  // 所以走 fetch + ReadableStream,手工按 SSE 分帧解析。

  function handleBlock(block, ctx) {
    let event = null;
    let data  = null;
    for (const line of block.split("\n")) {
      if (line.startsWith("event: "))      event = line.slice(7).trim();
      else if (line.startsWith("data: "))  data  = line.slice(6);
    }
    if (!event || data === null) return;

    let payload;
    try { payload = JSON.parse(data); } catch { return; }

    switch (event) {
      case "meta":
        if (payload.session_id) sessionId = payload.session_id;
        break;
      case "tool_call":
        addBadge(ctx.badges, payload.name);
        break;
      case "tool_result":
        settleBadge(ctx.badges, ctx.lastTool, payload.ok);
        break;
      case "token":
        ctx.body.textContent += payload.text || "";
        scrollToEnd();
        break;
      case "citations":
        ctx.citations = payload.items || [];
        break;
      case "error":
        ctx.failed = true;
        const p = document.createElement("div");
        p.className = "error";
        p.textContent = `⚠️ ${payload.message || "服务暂时不可用"}`;
        ctx.bubble.appendChild(p);
        scrollToEnd();
        break;
    }
  }

  async function send(text) {
    busy = true;
    sendEl.disabled = true;
    inputEl.disabled = true;

    const ctx = { ...addAssistant(), lastTool: null, failed: false };

    try {
      const resp = await fetch("/api/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(sessionId ? { session_id: sessionId, message: text }
                                       : { message: text }),
      });

      if (!resp.ok || !resp.body) {
        throw new Error(`HTTP ${resp.status}`);
      }

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        // stream:true 是关键 —— 不加的话,多字节中文会在 chunk 边界被切断成乱码,
        // 而 SSE 分片与 UTF-8 字符边界毫无关系。
        buffer += decoder.decode(value, { stream: true });

        let cut;
        while ((cut = buffer.indexOf("\n\n")) !== -1) {
          const block = buffer.slice(0, cut);
          buffer = buffer.slice(cut + 2);
          const before = ctx.badges.querySelectorAll(".badge").length;
          handleBlock(block, ctx);
          if (ctx.badges.querySelectorAll(".badge").length > before) {
            ctx.lastTool = ctx.badges.querySelector(".badge:last-child").dataset.tool;
          }
        }
      }
    } catch (err) {
      const p = document.createElement("div");
      p.className = "error";
      p.textContent = `⚠️ 连接中断(${err.message})`;
      ctx.bubble.appendChild(p);
    } finally {
      if (!ctx.body.textContent.trim() && !ctx.failed) {
        ctx.body.textContent = "(没有返回内容)";
      }
      makeCitesClickable(ctx);
      busy = false;
      sendEl.disabled = false;
      inputEl.disabled = false;
      inputEl.focus();
    }
  }

  // 把回复里的 [n] 换成可点的引用标记,点开弹出来源 chunk 原文 + 章节路径。
  function makeCitesClickable(ctx) {
    if (!ctx.citations || !ctx.citations.length) return;
    const text = ctx.body.textContent;
    if (!/\[\d+\]/.test(text)) return;
    ctx.body.innerHTML = text.replace(/\[\d+\]/g, (m) => {
      const n = parseInt(m.slice(1, -1), 10);
      const c = ctx.citations.find((x) => x.n === n);
      if (!c) return m;
      return `<a class="cite" data-n="${n}" title="${c.section_path || c.category}">${m}</a>`;
    });
    ctx.body.querySelectorAll(".cite").forEach((a) => {
      a.addEventListener("click", () => {
        const c = ctx.citations.find((x) => x.n === parseInt(a.dataset.n, 10));
        if (!c) return;
        showCitation(c);
      });
    });
  }

  function showCitation(c) {
    const box = document.createElement("div");
    box.className = "cite-pop";
    const path = c.section_path ? `<div class="cite-path">${c.section_path}</div>` : "";
    box.innerHTML = `${path}<div class="cite-answer">${c.answer}</div>`;
    box.onclick = () => box.remove();
    document.body.appendChild(box);
  }

  // ── 交互 ──────────────────────────────────────────────

  function submit() {
    const text = inputEl.value.trim();
    if (!text || busy) return;
    inputEl.value = "";
    inputEl.style.height = "auto";
    addUser(text);
    send(text);
  }

  sendEl.addEventListener("click", submit);

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = `${Math.min(inputEl.scrollHeight, 132)}px`;
  });

  newEl.addEventListener("click", () => {
    if (busy) return;
    sessionId = null;
    logEl.replaceChildren();
    inputEl.focus();
  });

  inputEl.focus();
})();
</script>
</body>
</html>
